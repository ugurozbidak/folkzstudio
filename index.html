<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FolkzStudio</title>

    <meta
        name="description"
        content="FolkzStudio builds small products for people with big ideas."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter",
                "Segoe UI", sans-serif;
            background: #f5f3ed;
            color: #17251e;
            min-height: 100vh;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .contact {
            text-decoration: none;
            color: #17251e;
            font-size: 14px;
        }

        .hero {
            max-width: 900px;
            margin: auto 0;
            padding: 100px 0;
        }

        .eyebrow {
            font-size: 14px;
            margin-bottom: 24px;
            opacity: 0.55;
        }

        h1 {
            font-size: clamp(56px, 9vw, 130px);
            line-height: 0.92;
            letter-spacing: -0.07em;
            font-weight: 600;
        }

        .description {
            max-width: 550px;
            margin-top: 36px;
            font-size: 20px;
            line-height: 1.5;
            opacity: 0.7;
        }

        footer {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            main {
                padding: 24px;
            }

            .hero {
                padding: 60px 0;
            }

            .description {
                font-size: 18px;
            }

            footer {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<main>

    <nav>
        <div class="logo">FolkzStudio</div>

        <a class="contact" href="mailto:hello@fol.kz">
            Get in touch
        </a>
    </nav>

    <section class="hero">

        <div class="eyebrow">
            Independent product studio · 2026
        </div>

        <h1>
            Small products.<br>
            Thoughtfully built.
        </h1>

        <p class="description">
            FolkzStudio is a small product studio creating useful,
            focused and human-centered digital products.
        </p>

    </section>

    <footer>
        <span>© 2026 FolkzStudio</span>
        <span>fol.kz</span>
    </footer>

</main>

</body>
</html>
